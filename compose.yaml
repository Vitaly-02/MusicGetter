services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-musicgetter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-musicgetter}
      POSTGRES_DB: ${POSTGRES_DB:-musicgetter}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-musicgetter}:${POSTGRES_PASSWORD:-musicgetter}@postgres:5432/${POSTGRES_DB:-musicgetter}?sslmode=disable
      EXTENSION_ORIGINS: ${EXTENSION_ORIGINS:-}
      API_IP_PER_MINUTE: ${API_IP_PER_MINUTE:-120}
      API_OWNER_PER_MINUTE: ${API_OWNER_PER_MINUTE:-60}
      API_CLAIM_PER_MINUTE: ${API_CLAIM_PER_MINUTE:-5}
      HTTP_ADDR: "0.0.0.0:${BACKEND_INTERNAL_PORT:-8080}"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-0}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5s}
      DB_MAX_CONN_LIFETIME: ${DB_MAX_CONN_LIFETIME:-1h}
      DB_MAX_CONN_IDLE_TIME: ${DB_MAX_CONN_IDLE_TIME:-5m}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-15s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-15s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
      HTTP_REQUEST_TIMEOUT: ${HTTP_REQUEST_TIMEOUT:-10s}
      HEALTH_TIMEOUT: ${HEALTH_TIMEOUT:-2s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      MIGRATION_TIMEOUT: ${MIGRATION_TIMEOUT:-60s}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:${BACKEND_INTERNAL_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${BACKEND_INTERNAL_PORT:-8080}/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_grace_period: 30s

  bot:
    profiles: [bot]
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["/app/bot"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-musicgetter}:${POSTGRES_PASSWORD:-musicgetter}@postgres:5432/${POSTGRES_DB:-musicgetter}?sslmode=disable
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 30s

  worker:
    profiles: [worker]
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["/app/worker"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-musicgetter}:${POSTGRES_PASSWORD:-musicgetter}@postgres:5432/${POSTGRES_DB:-musicgetter}?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WORKER_LEASE: ${WORKER_LEASE:-30s}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-1s}
      WORKER_JOB_TIMEOUT: ${WORKER_JOB_TIMEOUT:-2m}
      WORKER_RETRY_BASE: ${WORKER_RETRY_BASE:-1s}
      WORKER_RETRY_MAX: ${WORKER_RETRY_MAX:-5m}
      MATCHER_SEARCH_CONCURRENCY: ${MATCHER_SEARCH_CONCURRENCY:-4}
      MATCHER_SEARCH_TIMEOUT: ${MATCHER_SEARCH_TIMEOUT:-10s}
      MATCHER_CACHE_TTL: ${MATCHER_CACHE_TTL:-5m}
      MATCHER_NEGATIVE_TTL: ${MATCHER_NEGATIVE_TTL:-30s}
      MATCHER_CACHE_ENTRIES: ${MATCHER_CACHE_ENTRIES:-512}
      MATCHER_CACHE_BYTES: ${MATCHER_CACHE_BYTES:-16777216}
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 30s

volumes:
  postgres_data:
